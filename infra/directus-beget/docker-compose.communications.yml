# Optional antivirus profile. The base compose file already mounts the private
# communications storage and keeps the endpoint disabled by default.
# docker compose -f docker-compose.yml -f docker-compose.communications.yml --profile scanner up -d
services:
  clamav:
    image: clamav/clamav:1.4
    profiles: ["scanner"]
    restart: unless-stopped
    mem_limit: 4g
    volumes:
      - clamav-signatures:/var/lib/clamav
    # No published port; clamd is reachable only inside the compose network.
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
volumes:
  clamav-signatures:
