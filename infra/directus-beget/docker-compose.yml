# Directus + PostgreSQL (+ optional Redis cache) for a Beget VPS.
#
# Secrets are NOT stored here — every sensitive value is read from a local .env
# file (see .env.example). Copy it first:
#
#   cp .env.example .env   # then edit .env with real values, never commit it
#   docker compose up -d
#
# nginx (see ./nginx/) terminates TLS and proxies the public site and the
# api/admin subdomain to the Directus container.

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  media-sanitizer:
    build:
      context: ../communications/media-sanitizer
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    networks: [sanitizer]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 5

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    # Optional: Directus uses this for caching and rate-limiting when enabled.
    # Remove this service (and the CACHE_*/REDIS env in .env) if not needed.
    logging: *default-logging

  directus:
    image: directus/directus:11.17.4
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      # Bind to localhost only; nginx proxies to it. Adjust if running without nginx.
      - "127.0.0.1:8055:8055"
    networks: [default, sanitizer]
    volumes:
      - ./uploads:/directus/uploads
      - ./extensions-bundled:/directus/extensions:ro
      - ./private-communications:/directus/private-communications
    secrets:
      - communications_s3_access_key
      - communications_s3_secret_key
    logging: *default-logging
    environment:
      SECRET: ${SECRET}

      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      # First-run bootstrap admin. Change the password after first login.
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # Public URL Directus advertises (used for links, assets, OAuth, etc.).
      PUBLIC_URL: ${PUBLIC_URL}

      # Studio previews sanitized private audio/video through authenticated Blob URLs.
      # Keep media restricted to this origin and in-memory Blob objects only.
      CONTENT_SECURITY_POLICY_DIRECTIVES__MEDIA_SRC: "array:'self',blob:"

      # Optional Telegram endpoint. The separate worker owns the Telegram token.
      ISVOI_TELEGRAM_ENABLED: ${ISVOI_TELEGRAM_ENABLED:-false}
      ISVOI_TELEGRAM_BOT_ID: ${ISVOI_TELEGRAM_BOT_ID:-}
      ISVOI_TELEGRAM_WORKER_USER_ID: ${ISVOI_TELEGRAM_WORKER_USER_ID:-}
      ISVOI_TELEGRAM_MODE: ${ISVOI_TELEGRAM_MODE:-test}
      ISVOI_TELEGRAM_CONVERSATIONS_ENABLED: ${ISVOI_TELEGRAM_CONVERSATIONS_ENABLED:-false}
      ISVOI_TELEGRAM_NOTIFICATIONS_ENABLED: ${ISVOI_TELEGRAM_NOTIFICATIONS_ENABLED:-false}
      ISVOI_TELEGRAM_BOT_USERNAME: ${ISVOI_TELEGRAM_BOT_USERNAME:-}
      ISVOI_TELEGRAM_INTAKE_USER_ID: ${ISVOI_TELEGRAM_INTAKE_USER_ID:-}
      # Activates the legacy Telegram API adapter backed by the common
      # communications tables. Set only during the controlled cutover.
      ISVOI_TELEGRAM_USE_COMMUNICATIONS: ${ISVOI_TELEGRAM_USE_COMMUNICATIONS:-false}

      # Omnichannel endpoint. Keep disabled until the additive schema and
      # scoped worker identities have passed the release checks.
      ISVOI_COMMUNICATIONS_ENABLED: ${ISVOI_COMMUNICATIONS_ENABLED:-false}
      ISVOI_COMMUNICATIONS_PRIVATE_DIR: /directus/private-communications
      ISVOI_COMMUNICATIONS_STORAGE_DRIVER: ${ISVOI_COMMUNICATIONS_STORAGE_DRIVER:-local}
      ISVOI_COMMUNICATIONS_S3_ENDPOINT: ${ISVOI_COMMUNICATIONS_S3_ENDPOINT:-}
      ISVOI_COMMUNICATIONS_S3_REGION: ${ISVOI_COMMUNICATIONS_S3_REGION:-ru1}
      ISVOI_COMMUNICATIONS_S3_BUCKET: ${ISVOI_COMMUNICATIONS_S3_BUCKET:-}
      ISVOI_COMMUNICATIONS_S3_PREFIX: ${ISVOI_COMMUNICATIONS_S3_PREFIX:-communications/objects}
      ISVOI_COMMUNICATIONS_S3_FORCE_PATH_STYLE: ${ISVOI_COMMUNICATIONS_S3_FORCE_PATH_STYLE:-true}
      ISVOI_COMMUNICATIONS_S3_ACCESS_KEY_FILE: /run/secrets/communications_s3_access_key
      ISVOI_COMMUNICATIONS_S3_SECRET_KEY_FILE: /run/secrets/communications_s3_secret_key
      ISVOI_COMMUNICATIONS_SANITIZER_URL: ${ISVOI_COMMUNICATIONS_SANITIZER_URL:-http://media-sanitizer:8080}
      ISVOI_MAX_SUPPORT_WEBHOOK_SECRET: ${ISVOI_MAX_SUPPORT_WEBHOOK_SECRET:-}

      # Realtime / WebSockets.
      WEBSOCKETS_ENABLED: ${WEBSOCKETS_ENABLED}

      # Optional Redis cache (remove if the cache service is removed).
      CACHE_ENABLED: ${CACHE_ENABLED}
      CACHE_STORE: redis
      CACHE_TTL: ${CACHE_TTL}
      CACHE_AUTO_PURGE: ${CACHE_AUTO_PURGE}
      CACHE_NAMESPACE: ${CACHE_NAMESPACE}
      REDIS: redis://cache:6379

      # File/import/Marketplace guardrails.
      MARKETPLACE_TRUST: ${MARKETPLACE_TRUST}
      FILES_MAX_UPLOAD_SIZE: ${FILES_MAX_UPLOAD_SIZE}
      FILES_MIME_TYPE_ALLOW_LIST: ${FILES_MIME_TYPE_ALLOW_LIST}
      IMPORT_IP_DENY_LIST: ${IMPORT_IP_DENY_LIST}

      # CORS so the Next.js site can call the API from the browser.
      CORS_ENABLED: "true"
      CORS_ORIGIN: ${CORS_ORIGIN}

secrets:
  communications_s3_access_key:
    file: ${ISVOI_COMMUNICATIONS_S3_ACCESS_KEY_HOST_FILE:-./empty-secret.example}
  communications_s3_secret_key:
    file: ${ISVOI_COMMUNICATIONS_S3_SECRET_KEY_HOST_FILE:-./empty-secret.example}

networks:
  sanitizer:
    internal: true

# Named bind mounts above keep DB data, uploads and extensions on the host.
# These directories are gitignored (see repo .gitignore).
